[project]
name = "data-engine"
version = "0.1.0"
description = "Active-learning data engine for autonomous driving perception"
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.3.40",
    "polars>=1.0",
    "pyarrow>=17.0",
    "mlflow>=2.16",
    "click>=8.1",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
